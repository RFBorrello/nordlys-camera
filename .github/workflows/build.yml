name: build-apk

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Branch pushes: a debug APK, downloadable as a workflow artifact.
  debug-apk:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nordlys-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  # v* tags: a minified APK signed with the release key, attached to the
  # GitHub release. Tags with a pre-release suffix (v0.3.0-beta1) publish as
  # pre-releases.
  release-apk:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Decode release keystore
        env:
          NORDLYS_KEYSTORE_BASE64: ${{ secrets.NORDLYS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$NORDLYS_KEYSTORE_BASE64" ]; then
            echo "::error::NORDLYS_KEYSTORE_BASE64 secret is not set; see README > Releases"
            exit 1
          fi
          echo "$NORDLYS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nordlys-release.jks"
          echo "NORDLYS_KEYSTORE_PATH=$RUNNER_TEMP/nordlys-release.jks" >> "$GITHUB_ENV"

      - name: Assemble signed release APK
        env:
          NORDLYS_KEYSTORE_PASSWORD: ${{ secrets.NORDLYS_KEYSTORE_PASSWORD }}
          NORDLYS_KEY_ALIAS: ${{ secrets.NORDLYS_KEY_ALIAS }}
          NORDLYS_KEY_PASSWORD: ${{ secrets.NORDLYS_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Verify signature and name artifacts
        id: names
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          tag="${GITHUB_REF_NAME}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/nordlys-${tag}.apk"
          cp app/build/outputs/mapping/release/mapping.txt "dist/nordlys-${tag}-mapping.txt"
          if [[ "$tag" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/nordlys-release.jks"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/nordlys-${{ github.ref_name }}.apk
            dist/nordlys-${{ github.ref_name }}-mapping.txt
          draft: false
          prerelease: ${{ steps.names.outputs.prerelease }}
